name: Begonya Promotion Readiness

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  promotion-readiness:
    name: Frozen Holdout & Promotion Readiness
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macro dependencies
        working-directory: macro_engine
        run: pip install -r requirements.txt

      - name: Run promotion readiness test
        working-directory: macro_engine
        run: python -m calibration.run_promotion_readiness
