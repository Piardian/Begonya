name: Begonya CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smc-engine-tests:
    name: SMC Engine Quality & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: smc_engine/package-lock.json

      - name: Install dependencies
        working-directory: smc_engine
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Run Core SMC Test Suites
        working-directory: smc_engine
        run: node --max-old-space-size=4096 ./node_modules/jest/bin/jest.js tests/liquidityMagnetDetector.test.ts tests/opposingObstacleDetector.test.ts tests/smc2Rules.test.ts tests/poller.test.ts tests/telegramFormatter.test.ts tests/sharedCache.test.ts --runInBand

  macro-engine-tests:
    name: Deterministic Macro Metrics Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macro dependencies
        working-directory: macro_engine
        run: pip install -r requirements.txt

      - name: Run deterministic macro tests
        working-directory: macro_engine
        run: python -m unittest discover -s tests -p 'test_deterministic_metrics.py' -v

  historical-macro-replay:
    name: Historical Macro Replay & Determinism
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install macro dependencies
        working-directory: macro_engine
        run: pip install -r requirements.txt

      - name: Run historical replay and determinism tests
        working-directory: macro_engine
        run: python -m unittest discover -s tests -p 'test_historical_replay.py' -v

  system-health-audit:
    name: Orchestration & System Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Institutional Health & Integration Audit
        run: python orchestrator/health_check.py
